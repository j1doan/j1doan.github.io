<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100;0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="page-wrap" style="margin:50px 100px;background-color:rgb(255,255,255);padding:50px;color:rgb(57,58,58)">
  <h1 style="font-family:'Roboto';font-weight:300">Contact</h1>
  <nav style="font-family:'Roboto Condensed';text-align:right;font-size:20px"><a href="index.html">Home</a></nav>
  <p style="font-family:'Roboto Condensed';font-weight:300;font-size:18px">GitHub: <a href="https://github.com/j1doan">github.com/j1doan</a></p>
  <p style="font-family:'Roboto Condensed';font-weight:300;font-size:18px">LinkedIn: <a href="https://www.linkedin.com/in/james-doan-a3a983274">linkedin.com/in/james-doan-a3a983274</a></p>

  <h2 style="font-family:'Roboto';font-weight:300">Send a message</h2>
  <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>
    </div>
    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="honeypot">
    <button type="submit">Send message</button>
  </form>
</div>
</body>
</html>
